<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackCellUA — WOT Portal</title>
    <style>
        :root {
            --dark-bg: #0a0a0c;
            --neon-blue: #00d4ff;
            --neon-gold: #ffcc00;
            --text: #e0e0e0;
        }
        body {
            background-color: var(--dark-bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            border-bottom: 2px solid #222;
        }
        .btn-ui {
            padding: 12px 25px;
            border: 2px solid var(--neon-blue);
            background: transparent;
            color: var(--neon-blue);
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-ui.gold { border-color: var(--neon-gold); color: var(--neon-gold); }
        .btn-ui:hover { box-shadow: 0 0 15px var(--neon-blue); }
        .btn-ui.gold:hover { box-shadow: 0 0 15px var(--neon-gold); }

        .section-card {
            background: #151518;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }
        .tank-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    </style>
</head>
<body>

    <div class="header-panel">
        <button class="btn-ui">Правила сайту</button>
        <button class="btn-ui gold">Тех підтримка</button>
    </div>

    <div class="section-card">
        <h3>ОБЛАДНАННЯ ДЛЯ ТАНКІВ</h3>
        <div class="tank-grid">
            <div><strong>Object 277:</strong> Закалка, Досилач, Турбіна</div>
            <div><strong>Kranvagn:</strong> Стабілізатор, Досилач, Турбіна</div>
            <div><strong>CS-63:</strong> Турбіна, Стабілізатор, Вентиль</div>
        </div>
    </div>

    <div id="user-display"></div>

    <script>
        // Ваші скрипти залишаються без змін
        function updateGarageCount() {
            const checked = document.querySelectorAll('.garage-checkbox:checked').length;
            console.log('Обрано: ' + checked);
        }
    </script>
</body>
</html>
